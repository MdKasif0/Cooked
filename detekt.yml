build:
  maxIssues: 20
  excludeCorrectable: false

complexity:
  TooManyFunctions:
    active: false
  LongMethod:
    threshold: 120
  CyclomaticComplexMethod:
    threshold: 20

naming:
  FunctionNaming:
    functionPattern: '^[a-zA-Z][a-zA-Z0-9]*$'
    ignoreAnnotated: ['Composable']

style:
  MagicNumber:
    active: false
  WildcardImport:
    active: false
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']

